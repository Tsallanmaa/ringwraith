<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e261d"/>
      <stop offset="1" stop-color="#231d16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8cf8e"/>
      <stop offset=".5" stop-color="#b8913a"/>
      <stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#d8bd7a" stroke-opacity=".55" stroke-width="9" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="1.5"/>
</svg>
